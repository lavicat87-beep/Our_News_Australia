{% extends "base.html" %}
{% block title %}OurNews | Submit Story{% endblock %}

{% block content %}
<section class="paper narrow">
  <h1>Submit Community Story</h1>
  <p>Your submission will be reviewed by local moderators before publishing.</p>
  <form method="post" enctype="multipart/form-data" class="stack-form">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" required>

    <label for="slug">Slug</label>
    <input id="slug" name="slug" type="text" placeholder="my-story-title" required>

    <label for="town_id">Town</label>
    <select id="town_id" name="town_id" required>
      <option value="">Select a town</option>
      {% for town in towns %}
      <option value="{{ town.id }}">{{ town.name }} ({{ town.region.state.name }} -> {{ town.region.name }})</option>
      {% endfor %}
    </select>

    <label for="category">Category</label>
    <select id="category" name="category" required>
      {% for category in post_categories %}
      <option value="{{ category }}">{{ category }}</option>
      {% endfor %}
    </select>

    <label for="summary">Summary</label>
    <textarea id="summary" name="summary" rows="3" required></textarea>

    <label for="content">Content</label>
    <textarea id="content" name="content" rows="8" required></textarea>

    <label for="image_url">Photo URL (optional)</label>
    <input id="image_url" name="image_url" type="url" placeholder="https://...">

    <label for="video_url">Video URL (optional)</label>
    <input id="video_url" name="video_url" type="url" placeholder="https://...">

    <label for="media_file">Or upload a photo/video (optional)</label>
    <input id="media_file" name="media_file" type="file" accept="image/*,video/*">

    <button class="btn" type="submit">Submit Story</button>
  </form>
</section>
{% endblock %}
