{% extends "base.html" %}
{% block title %}OurNews | Register{% endblock %}

{% block content %}
<section class="paper narrow">
  <h1>Create Contributor Account</h1>
  <form method="post" class="stack-form">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>

    <label for="town_id">Town</label>
    <select id="town_id" name="town_id" required>
      <option value="">Select a town</option>
      {% for town in towns %}
      <option value="{{ town.id }}">{{ town.name }} ({{ town.region.name }})</option>
      {% endfor %}
    </select>

    <label for="bio">Contributor Bio</label>
    <textarea id="bio" name="bio" rows="4" placeholder="Tell your community about yourself"></textarea>

    <button class="btn" type="submit">Register</button>
  </form>
</section>
{% endblock %}
